name: Manager Coach IA (AAB + APK)

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: managercoach-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Chave de envio (upload key) para a Play Store
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Upload key restaurada."
          else
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64: o AAB sai assinado com a chave de debug (a Play Store recusa)."
          fi

      - name: Firebase (opcional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase ligado."
          else
            echo "Sem GOOGLE_SERVICES_JSON: app sem Crashlytics/Analytics."
          fi

      - name: Testes unitários
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee "$GITHUB_WORKSPACE/tests.log"

      - name: Lint
        id: lint
        continue-on-error: true
        run: gradle --no-daemon :app:lintDebug

      - name: APK debug
        id: debug
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/debug.log"

      - name: AAB e APK de release
        id: release
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: gradle --no-daemon :app:bundleRelease :app:assembleRelease

      - name: Erros no resumo
        if: always()
        run: |
          {
            echo "## Erros de compilação"
            grep -E "^e: " "$GITHUB_WORKSPACE/debug.log" 2>/dev/null | head -40 || true
            echo ""
            echo "## Testes que falharam"
            grep -E -A3 "FAILED$" "$GITHUB_WORKSPACE/tests.log" 2>/dev/null | head -60 || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar AAB (Play Store) e APKs (teste no celular)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-coach-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-coach-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Falha se testes ou lint falharam
        if: always()
        run: |
          echo "tests=${{ steps.tests.outcome }} lint=${{ steps.lint.outcome }} debug=${{ steps.debug.outcome }} release=${{ steps.release.outcome }}"
          if [ "${{ steps.tests.outcome }}" = "failure" ] || [ "${{ steps.lint.outcome }}" = "failure" ] || [ "${{ steps.debug.outcome }}" = "failure" ] || [ "${{ steps.release.outcome }}" = "failure" ]; then
            exit 1
          fi
